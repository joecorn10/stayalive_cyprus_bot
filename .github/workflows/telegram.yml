name: Telegram bot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Keep a full runner cycle between workers so they do not queue behind
    # dependency installation and state persistence.
    - cron: "3/10 * * * *"

permissions:
  contents: write

concurrency:
  group: stayalive-cyprus-state
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Telegram worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYPRUS_EVENT_TOKEN }}
        run: python -m app.telegram_worker

      - name: Sync events
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYPRUS_EVENT_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          python -c "from app.sync import sync_all; print('Event sync started'); added = sync_all(); print(f'Event sync finished: {added} new events')"

      - name: Save database and Telegram offset
        if: always() && github.event_name != 'push'
        run: |
          mkdir -p /tmp/stayalive-state
          if [ -f events.db ]; then
            cp events.db /tmp/stayalive-state/events.db
          fi
          if [ -f data/telegram_offset.json ]; then
            cp data/telegram_offset.json /tmp/stayalive-state/telegram_offset.json
          fi

          git fetch origin main
          git reset --hard origin/main

          if [ -f /tmp/stayalive-state/events.db ]; then
            cp /tmp/stayalive-state/events.db events.db
            git add events.db
          fi
          if [ -f /tmp/stayalive-state/telegram_offset.json ]; then
            mkdir -p data
            cp /tmp/stayalive-state/telegram_offset.json data/telegram_offset.json
            git add data/telegram_offset.json
          fi

          if git diff --cached --quiet; then
            echo "No database or offset changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist bot state"
          git push origin HEAD:main
