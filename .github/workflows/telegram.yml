name: Telegram bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths-ignore:
      - "events.db"
      - "data/telegram_offset.json"
      - ".github/workflows/telegram.yml"

permissions:
  contents: write

concurrency:
  group: stayalive-cyprus-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Telegram worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYPRUS_EVENT_TOKEN }}
        run: python -m app.telegram_worker

      - name: Save database and Telegram offset
        run: |
          if [ -f events.db ]; then
            git add events.db
          fi
          git add data/telegram_offset.json
          if git diff --cached --quiet; then
            echo "No database or offset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist bot state"
          git pull --rebase origin main
          git push
