name: Telegram bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "data/telegram_offset.json"
      - "events.db"
  schedule:
    - cron: "*/2 * * * *"

permissions:
  contents: write

concurrency:
  group: stayalive-cyprus-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Telegram worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYPRUS_BOT_TOKEN }}
        run: python -m app.telegram_worker

      - name: Save database and Telegram offset
        run: |
          if [ -f events.db ]; then
            git add events.db
          fi
          git add data/telegram_offset.json
          if git diff --cached --quiet; then
            echo "No database or offset changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git commit -m "chore: persist bot state" || true
            git pull --rebase origin main || {
              git rebase --abort || true
              git reset --soft origin/main
              echo "Retrying state persistence ($attempt/3)..."
              sleep 3
              continue
            }
            if git push; then
              echo "Bot state persisted."
              exit 0
            fi
            echo "Push failed; retrying state persistence ($attempt/3)..."
            sleep 3
            git fetch origin main
            git reset --soft origin/main
          done

          echo "Could not persist bot state after 3 attempts."
          exit 1
