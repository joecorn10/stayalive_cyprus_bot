name: Stantar diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "app/diagnostics.py"
      - "app/parsers/website.py"

permissions:
  contents: write

concurrency:
  group: stantar-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run diagnostic
        run: python -m app.diagnostics
      - name: Save report
        run: |
          git add data/stantar_diagnostic.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
            exit 0
          fi
          git commit -m "chore: save Stantar diagnostic"
          git push origin HEAD:main
