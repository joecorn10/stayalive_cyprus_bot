name: Event sync

on:
  schedule:
    - cron: "2/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stayalive-cyprus-event-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sync events
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYPRUS_EVENT_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          python -c "from app.sync import sync_all; print('Event sync started'); added = sync_all(); print(f'Event sync finished: {added} new events')"

      - name: Diagnose catalog quality
        if: always()
        run: |
          python scripts/catalog_diagnostics.py | tee catalog_diagnostics.txt

      - name: Upload catalog diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-diagnostics-${{ github.run_number }}
          path: catalog_diagnostics.txt
          if-no-files-found: warn

      - name: Persist database
        if: always()
        run: |
          mkdir -p /tmp/stayalive-state
          if [ -f events.db ]; then
            cp events.db /tmp/stayalive-state/events.db
          fi

          git fetch origin main
          git reset --hard origin/main

          if [ -f /tmp/stayalive-state/events.db ]; then
            cp /tmp/stayalive-state/events.db events.db
            git add events.db
          fi

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist event sync state"
          git push origin HEAD:main
