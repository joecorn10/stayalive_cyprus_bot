name: Preparation validation

on:
  push:
    branches:
      - prepare/instagram-free-fallback-cleanup
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q -s tests

      - name: Run Instagram diagnostic
        env:
          INSTAGRAM_DIAGNOSTIC_URL: https://www.instagram.com/zebra_limassol/
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python -m app.instagram_diagnostic
