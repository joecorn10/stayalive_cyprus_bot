name: Daily event sync

on:
  workflow_dispatch:
  schedule:
    # Refresh the event database every 30 minutes.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  # Telegram and event sync both write events.db/offset-backed state.
  # They must never run at the same time.
  group: stayalive-cyprus-state
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync events
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYPRUS_EVENT_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python -c "from app.sync import sync_all; print('Event sync started'); added = sync_all(); print(f'Event sync finished: {added} new events')"

      - name: Save database
        run: |
          if [ ! -f events.db ]; then
            echo "events.db was not created."
            exit 1
          fi
          git add events.db
          if git diff --cached --quiet; then
            echo "No database changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: event sync"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
